[project]
name = "eotools"
version = "0.1.0"
description = "A collection of tools and modules for building processing chains."
authors = [{name = "HYGEOS team"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "dask",
    "xarray",
    "cf-xarray",
    "pint-xarray",
    "pyhdf",     # gaseous_correction
    "openpyxl",  # SRF files (.xlsx)
    "xlrd",      # SRF files (.xls, used only for get_SRF_meris)
    "hygeos-core>=2.0.2,<3",
    "luts>=1,<2",
]

[project.optional-dependencies]
eoread = [
    "eoread>=2,<3",
]
gatiab = [
    "gatiab"
]

[project.urls]
Homepage = "https://github.com/hygeos/eotools"
Documentation = "https://hygeos.github.io/eotools/"
Changelog = "https://github.com/hygeos/eotools/blob/main/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
eotools = { path = ".", editable = true, extras = ["eoread"]}

[tool.pixi.dependencies]
pytest-html = "*"
pytest = "*"
matplotlib-base = "*"
pytest-xdist = "*"
xarray = "*"
openpyxl = "*"
pint-xarray = "*"
cf-xarray = "*"
xlrd = "*"  # used only for get_SRF_meris
gatiab = "*"
nbformat = "*"
nbclient = "*"
jupyter = "*"
quartodoc = "*"
griffe = "<2.0"   # Compatibility with quartodoc
jupyter-cache = "*"

[tool.pixi.tasks]
quartodoc-build = "quartodoc build --config docs/_quarto.yml"
quartodoc-render = {cmd = "quarto render", depends-on=['quartodoc-build'], cwd="docs"}
clean = "rm -rf docs/_site docs/reference"

[tool.pixi.feature.gatiab.dependencies]
gatiab = "*"

[tool.pixi.feature.gatiab.tasks]
tests = "pytest tests/"

[tool.pixi.environments]
default = { solve-group = "default" }
gatiab = { features = ["gatiab"], solve-group = "default" }

